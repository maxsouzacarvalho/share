# ===============================
# ENVIO PARA SECURONIX - CENTOS 6
# Formato NXLog CE (JSON)
# Transporte UDP
# ===============================

# Entrada de logs
module(load="imuxsock")     # Logs locais (/dev/log)
module(load="imklog")       # Logs do kernel
module(load="omfwd")        # Envio via rede

# Template no padrão NXLog CE esperado pelo Securonix
template(name="SecuronixNXLog" type="list") {
    constant(value="<") property(name="pri") constant(value=">")
    property(name="timereported" dateFormat="rfc3164")
    constant(value=" ")
    property(name="hostname")
    constant(value=" ")

    constant(value="{")
    constant(value="\"EventReceivedTime\":\"")
        property(name="timereported" dateFormat="mysql")
    constant(value="\",")

    constant(value="\"SourceModuleName\":\"rsyslog\",")
    constant(value="\"SourceModuleType\":\"imuxsock\",")

    constant(value="\"SyslogFacilityValue\":")
        property(name="syslogfacility")
    constant(value=",")

    constant(value="\"SyslogFacility\":\"")
        property(name="syslogfacility-text")
    constant(value="\",")

    constant(value="\"SyslogSeverityValue\":")
        property(name="syslogseverity")
    constant(value=",")

    constant(value="\"SyslogSeverity\":\"")
        property(name="syslogseverity-text")
    constant(value="\",")

    constant(value="\"SeverityValue\":")
        property(name="syslogseverity")
    constant(value=",")

    constant(value="\"Severity\":\"")
        property(name="syslogseverity-text")
    constant(value="\",")

    constant(value="\"Hostname\":\"")
        property(name="hostname")
    constant(value="\",")

    constant(value="\"EventTime\":\"")
        property(name="timereported" dateFormat="mysql")
    constant(value="\",")

    constant(value="\"SourceName\":\"")
        property(name="programname")
    constant(value="\",")

    constant(value="\"ProcessID\":\"")
        property(name="pid")
    constant(value="\",")

    constant(value="\"Message\":\"")
        property(name="msg")
    constant(value="\"}")
    constant(value="\n")
}

# Envio para o coletor Securonix
*.* action(
    type="omfwd"
    Target="172.18.16.5"
    Port="6515"
    Protocol="udp"
    Template="SecuronixNXLog"
)
