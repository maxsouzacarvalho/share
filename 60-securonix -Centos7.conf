# === ENVIO PARA SECURONIX - TEMPLATE ESTILO NXLOG (CentOS 7 / UDP) ===
# Reproduz o formato JSON emitido pelo NXLog CE
# Compatível com coletores Securonix que esperam esse padrão

module(load="imuxsock")                        # Logs locais (processos do sistema)
module(load="imjournal" StateFile="imjournal.state")  # Systemd journal
module(load="omfwd")                           # Saída via rede (UDP)

# Template baseado no formato NXLog CE
template(name="SecuronixNXLog" type="list") {
    constant(value="<")              property(name="pri")      constant(value=">")
    property(name="timereported" dateFormat="rfc3164") constant(value=" ")
    property(name="hostname") constant(value=" ")
    constant(value="{")
    constant(value="\"EventReceivedTime\":\"")  property(name="timereported" dateFormat="mysql")  constant(value="\",")
    constant(value="\"SourceModuleName\":\"rsyslog\",")
    constant(value="\"SourceModuleType\":\"im_journal\",")
    constant(value="\"SyslogFacilityValue\":") property(name="syslogfacility") constant(value=",")
    constant(value="\"SyslogFacility\":\"")    property(name="syslogfacility-text") constant(value="\",")
    constant(value="\"SyslogSeverityValue\":") property(name="syslogseverity") constant(value=",")
    constant(value="\"SyslogSeverity\":\"")    property(name="syslogseverity-text") constant(value="\",")
    constant(value="\"SeverityValue\":")       property(name="syslogseverity") constant(value=",")
    constant(value="\"Severity\":\"")          property(name="syslogseverity-text") constant(value="\",")
    constant(value="\"Hostname\":\"")          property(name="hostname") constant(value="\",")
    constant(value="\"EventTime\":\"")         property(name="timereported" dateFormat="mysql") constant(value="\",")
    constant(value="\"SourceName\":\"")        property(name="programname") constant(value="\",")
    constant(value="\"ProcessID\":\"")         property(name="pid") constant(value="\",")
    constant(value="\"Message\":\"")           property(name="msg" format="rfc5424")  # Formato seguro para CentOS 7
    constant(value="\"}\n")
}

# Envio para Securonix via UDP
action(
    type="omfwd"
    Target="172.18.16.5"       # IP do coletor Securonix
    Port="6515"                # Porta configurada
    Protocol="udp"
    Template="SecuronixNXLog"
)
